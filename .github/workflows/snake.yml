name: contribution snake
# Redraws the snake that eats the contribution graph (README), daily and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2c037&color_dots=#161b22,#3b2836,#6e4b62,#a27f94,#f2c037
            dist/snake-light.svg?color_snake=#6e4b62&color_dots=#ebedf0,#e9dce4,#c9a9bd,#a27f94,#f2c037
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
